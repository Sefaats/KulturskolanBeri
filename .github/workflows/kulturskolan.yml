name: Bevaka Kulturskolan

on:
  schedule:
    # Långa kurser: var 30:e minut kl 05-19 UTC (skriptet håller sig till 07-20
    # svensk tid och till bevakningsperioderna).
    - cron: "*/30 5-19 * * *"
    # Långa kurser: var 5:e minut den 18 december, då vårens långa kurser öppnar.
    # GitHub tillåter inte tätare än 5 minuter.
    - cron: "*/5 5-19 18 12 *"
    # Korta kurser: en gång per dag, året runt (07:45 UTC = 08:45 eller 09:45 svensk tid).
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Läge"
        type: choice
        options: [normal, test, discover]
        default: normal

permissions:
  contents: write

concurrency:
  group: kulturskolan
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Kör bevakningen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$MODE" in
              test)     python kulturskolan_notiser.py --test ;;
              discover) python kulturskolan_notiser.py --discover ;;
              *)        python kulturskolan_notiser.py --scope all --force ;;
            esac
          elif [ "$SCHEDULE" = "45 7 * * *" ]; then
            python kulturskolan_notiser.py --scope short
          else
            python kulturskolan_notiser.py --scope long
          fi

      - name: Spara rådata vid discover
        if: ${{ inputs.mode == 'discover' }}
        uses: actions/upload-artifact@v4
        with:
          name: discover-dump
          path: discover_dump.json

      - name: Spara tillstånd
        run: |
          git config user.name "kulturskole-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kulturskolan_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Uppdatera tillstånd" && git push)
